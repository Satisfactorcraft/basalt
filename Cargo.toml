[package]
name = "basalt"
version = "0.1.0"
edition = "2021"
description = "A Vulkan powered game engine: the executable is the engine, the game is a folder."
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
ash = "0.38"
ash-window = "0.13"
env_logger = "0.11"
glam = "0.30"
gltf = "1.4"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "error-send"] }
notify = "8"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"

[profile.dev.package."*"]
# Keep dependencies (image decoding, gltf parsing, Lua) fast in debug builds.
opt-level = 2

[profile.release]
strip = true
